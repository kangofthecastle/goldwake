<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HUBRIS</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #020609; overflow: hidden;
    cursor: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: block;
    background:
      radial-gradient(circle at 50% 35%, rgba(22, 70, 82, 0.16), transparent 46%),
      #020609;
  }
  canvas {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: block;
    image-rendering: auto;
  }
  #gl  { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }
  #msg {
    position: fixed; inset: 0; z-index: 10;
    display: none;
    align-items: center; justify-content: center;
    color: #8ceaff; background: #020609;
    font-family: "SFMono-Regular", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    font-size: 22px; text-align: center; line-height: 1.6;
    padding: 40px; box-sizing: border-box;
  }
  #msg b { color: #ffd766; letter-spacing: 3px; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
  </div>
  <div id="msg"></div>

  <!-- Load order matters: no modules, each file hangs a namespace on window. -->
  <script src="js/sfx.js?v=20260723-continuous-world"></script>
  <script src="js/music.js?v=20260723-continuous-world"></script>
  <script src="js/sprites-data.js?v=20260724-guan-yu-sweep"></script>
  <script src="js/gl.js?v=20260724-guan-yu-sweep"></script>
  <script src="js/engine.js?v=20260723-continuous-world"></script>
  <script src="js/patterns.js?v=20260723-continuous-world"></script>
  <script src="js/run.js?v=20260723-continuous-world"></script>
  <script src="js/game.js?v=20260724-guan-yu-sweep"></script>
</body>
</html>
