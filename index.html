<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GOLDWAKE</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    cursor: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: block;
    background: #000;
  }
  canvas {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: block;
    image-rendering: auto;
  }
  #gl  { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }
  #msg {
    position: fixed; inset: 0; z-index: 10;
    display: none;
    align-items: center; justify-content: center;
    color: #7fdfff; background: #000;
    font-family: Consolas, "Courier New", monospace;
    font-size: 22px; text-align: center; line-height: 1.6;
    padding: 40px; box-sizing: border-box;
  }
  #msg b { color: #ffd766; letter-spacing: 3px; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
  </div>
  <div id="msg"></div>

  <!-- Load order matters: no modules, each file hangs a namespace on window. -->
  <script src="js/sfx.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/run.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
